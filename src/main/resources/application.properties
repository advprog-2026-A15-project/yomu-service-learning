spring.application.name=service-learning
server.port=8082

spring.datasource.url=jdbc:h2:file:./.localdb/yomu_learning;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# gRPC Configuration
grpc.server.port=9092

# Actuator and Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Profiling: SQL Logging and Execution Timing
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.use_nano_time=true

# HTTP Request Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Custom Application Logging
logging.level.id.ac.ui.cs.advprog.yomu=DEBUG
